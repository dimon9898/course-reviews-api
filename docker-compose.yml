
services:
  web:
    build: .
    container_name: fastapi_container
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000" 
    depends_on:
      - db  
    restart: always


  db:
    image: postgres:15-alphine
    container_name: db_container
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgres/data
    ports:
      - "5432:5432"
    restart: always


  nginx:
    image: nginx:latest
    container_name: nginx_container
    volumes:
     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
     - ./certbot/conf:/etc/letsencrypt
     - ./certbot/www:/var/certbot
    ports:
      - "80:80"
      - "443:443" 
    restart: always
    depends_on:
      - web
    
  certbot:
    image: certbot/certbot
    container_name: certbot_container
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/etc/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d; done'"    

volumes:
  pg_data: